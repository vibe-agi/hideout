SPECIFICATION Spec

CONSTANTS
    Destinations = {destination_a}
    Names = {name_a}
    ControlIDs = {control_a}
    BackendIDs = {backend_a}
    GuestIDs = {guest_a}
    SourceControlID = source_control
    SourceBackendID = source_backend
    SourceGuestID = source_guest
    BundleDigest = bundle_digest
    MaxCrashes = 1

INVARIANT TypeOK
INVARIANT BundleImmutable
INVARIANT RunnableIffActive
INVARIANT AtomicNamespaceVisibility
INVARIANT ProfileStateOwnedByStage
INVARIANT ControlIDsFreshAndDistinct
INVARIANT BackendIDsFreshAndDistinct
INVARIANT SafeCloneIDsFreshAndDistinct
INVARIANT ExactRestorePreserves
INVARIANT AuthorityRequiresApproval
INVARIANT InvalidBundleNeverStages
INVARIANT PolicyFrozenAfterPlan
INVARIANT ExclusiveNameClaims
INVARIANT EffectsAtMostOnce
INVARIANT ReplacementRequiresFreshImportPlan
INVARIANT StagedStateNeverRuns
INVARIANT RunnableRequiresDiskFidelity
INVARIANT RuntimeActivityRequiresActiveDestination
INVARIANT RuntimeMountReadyIffRebound
INVARIANT RuntimeMountRequiresAdoptionFidelity
INVARIANT TargetRequiresRuntimeDiskRebind

PROPERTY EveryDestinationEventuallyTerminal
PROPERTY CommittedEventuallyActive
PROPERTY RollbackEventuallyTerminal
PROPERTY ClaimEventuallySettles
PROPERTY CrashEventuallyRestarts
