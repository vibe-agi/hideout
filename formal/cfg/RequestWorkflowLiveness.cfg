\* One request and two authenticated surfaces cover claim, disconnect,
\* takeover, lease expiry, crash/restart, retry, session end, and cleanup.
SPECIFICATION Spec

CONSTANTS
    Requests = {request_a}
    Clients = {cli, tui}
    MaxTime = 2

INVARIANT TypeOK
INVARIANT ClaimedHasExactlyOneClaimant
INVARIANT TerminalHasNoClaimant
INVARIANT EndedSessionHasNoPendingAuthority
INVARIANT CleanupRequiresEndedSession

PROPERTY RequestEventuallyTerminal
PROPERTY EveryClaimEventuallyReleased
PROPERTY DisconnectedClaimEventuallyReleased
PROPERTY CrashEventuallyRestarts
PROPERTY EndedSessionEventuallyClean
