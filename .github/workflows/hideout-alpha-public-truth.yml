name: Hideout Public Alpha Docs Truth

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/hideout-alpha-public-truth.yml
      - releases/current.json
      - releases/receipts/**
      - README.md
      - README.zh-CN.md
      - install.sh
      - docs/STATUS.md
      - docs/distribution-bootstrap.md
      - docs/first-run-alpha.md
      - docs/support-matrix.md
      - CHANGELOG.md
      - scripts/render-public-release-docs.sh
      - scripts/test-standalone-install.sh
      - scripts/test-doc-truth-smoke.sh

permissions:
  contents: read

jobs:
  public-truth:
    name: Prove receipt-bound checked-in release truth
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out checked-in public truth
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Resolve checked-in public release state
        id: release_state
        run: |
          set -euo pipefail
          jq -e '
            .schema == "hideout.published-release-inventory/v1" and
            has("current")
          ' releases/current.json >/dev/null
          if jq -e '.current != null' releases/current.json >/dev/null; then
            echo "published=true" >>"$GITHUB_OUTPUT"
          else
            echo "published=false" >>"$GITHUB_OUTPUT"
            echo "No checked-in public release; Gate 0 owns candidate-neutral docs truth."
          fi

      - name: Install the declared Go toolchain
        if: steps.release_state.outputs.published == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate inventory, receipt, and generated docs
        if: steps.release_state.outputs.published == 'true'
        run: |
          set -euo pipefail
          tag=$(jq -er '.current.tag' releases/current.json)
          receipt="releases/receipts/${tag}.json"
          test -f "$receipt"
          out="$RUNNER_TEMP/hideout-public-docs-truth"
          scripts/test-doc-truth-smoke.sh --out "$out" --public-receipt "$receipt"
          jq -e '
            ([.proofs[].proofId] | sort) ==
            (["033.release.docs-public-truth","033.release.public-download"] | sort)
          ' "$out/public-release-evidence.json" >/dev/null

      - name: Retain bounded post-public proof
        if: steps.release_state.outputs.published == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hideout-public-alpha-docs-truth
          path: ${{ runner.temp }}/hideout-public-docs-truth
          if-no-files-found: error
          retention-days: 90
