name: Hideout CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: hideout-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate0_non_formal:
    name: Gate 0 / non-formal
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          # The concurrent-sessions and lifecycle e2e lanes verify their
          # performance baseline against a pinned full commit; a shallow
          # checkout cannot resolve it.
          fetch-depth: 0

      - name: Check out the official Homebrew tap for parity proof
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: vibe-agi/homebrew-tap
          path: .homebrew-tap-parity
          persist-credentials: false

      - name: Install the declared Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the native Java toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          architecture: aarch64

      - name: Reject a translated or unexpected Java toolchain
        run: scripts/lib/java-toolchain.sh

      - name: Install pinned Gate 0 tooling
        run: |
          set -euo pipefail
          brew install shellcheck lima
          test "$(shellcheck --version | awk '/^version:/ { print $2; exit }')" = "0.11.0"
          test "$(limactl --version | awk '{ print $NF; exit }')" = "2.2.0"
          npm install --global --ignore-scripts \
            markdownlint-cli2@0.22.1 markdownlint@0.40.0
          npm list --global --depth=0 --json | jq -e '
            .dependencies["markdownlint-cli2"].version == "0.22.1" and
            .dependencies.markdownlint.version == "0.40.0"
          ' >/dev/null

      - name: Install pinned workload-observer generation tooling
        run: |
          set -euo pipefail
          brew install llvm@19
          llvm_prefix="$(brew --prefix llvm@19)"
          echo "HIDEOUT_BPF_CLANG=${llvm_prefix}/bin/clang" >>"$GITHUB_ENV"
          echo "HIDEOUT_BPF_LLVM_STRIP=${llvm_prefix}/bin/llvm-strip" >>"$GITHUB_ENV"

      - name: Reject stale feature artifacts or missing licenses
        run: |
          set -euo pipefail
          scripts/gates/generated.sh
          scripts/gates/dependency-licenses.sh

      - name: Run the non-formal Gate 0 shard
        env:
          # A skipped tap parity check is not parity proof: CI checks out the
          # official tap and fails closed if the comparison cannot run.
          HIDEOUT_REQUIRE_TAP_PARITY: "1"
          HIDEOUT_TAP_FORMULA: ${{ github.workspace }}/.homebrew-tap-parity/Formula/hideout.rb
        run: scripts/test-gate0.sh --shard non-formal

  gate0_formal:
    name: Gate 0 / formal
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install the declared Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the native Java toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          architecture: aarch64

      - name: Reject a translated or unexpected Java toolchain
        run: scripts/lib/java-toolchain.sh

      - name: Run the complete formal Gate 0 shard
        id: formal
        env:
          # WorkloadObservation is memory/coordination bound on the hosted
          # arm64 runner: two TLC workers took more than 66 minutes for that
          # model, while the reviewed single-worker run completed normally.
          HIDEOUT_TLC_WORKERS: "1"
        run: scripts/test-gate0.sh --shard formal

      - name: Finalize the formal execution review
        if: ${{ always() }}
        env:
          FORMAL_STEP_OUTCOME: ${{ steps.formal.outcome }}
        run: |
          scripts/gates/formal-review-finalize.sh \
            --out .artifacts/045/formal/reviews \
            --outcome "$FORMAL_STEP_OUTCOME"

      - name: Retain the formal execution review
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate0-formal-review-${{ github.run_id }}
          path: .artifacts/045/formal/reviews/**/run-review.json
          if-no-files-found: error
          # The reviewed path is exact, but its repository-owned root is
          # intentionally private/hidden. upload-artifact excludes it by
          # default unless this is explicit.
          include-hidden-files: true
          retention-days: 14

  gate0:
    name: Build, test, and Gate 0
    if: ${{ always() }}
    needs:
      - gate0_non_formal
      - gate0_formal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Gate 0 shard
        env:
          NON_FORMAL_RESULT: ${{ needs.gate0_non_formal.result }}
          FORMAL_RESULT: ${{ needs.gate0_formal.result }}
        run: |
          test "$NON_FORMAL_RESULT" = success
          test "$FORMAL_RESULT" = success
