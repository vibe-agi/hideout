name: Hideout CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: hideout-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate0:
    name: Build, test, and Gate 0
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          # The concurrent-sessions and lifecycle e2e lanes verify their
          # performance baseline against a pinned full commit; a shallow
          # checkout cannot resolve it.
          fetch-depth: 0

      - name: Check out the official Homebrew tap for parity proof
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: vibe-agi/homebrew-tap
          path: .homebrew-tap-parity
          persist-credentials: false

      - name: Install the declared Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned Gate 0 tooling
        run: |
          set -euo pipefail
          brew install shellcheck lima
          test "$(shellcheck --version | awk '/^version:/ { print $2; exit }')" = "0.11.0"
          test "$(limactl --version | awk '{ print $NF; exit }')" = "2.2.0"
          npm install --global --ignore-scripts \
            markdownlint-cli2@0.22.1 markdownlint@0.40.0
          npm list --global --depth=0 --json | jq -e '
            .dependencies["markdownlint-cli2"].version == "0.22.1" and
            .dependencies.markdownlint.version == "0.40.0"
          ' >/dev/null

      - name: Install pinned workload-observer generation tooling
        run: |
          set -euo pipefail
          brew install llvm@19
          llvm_prefix="$(brew --prefix llvm@19)"
          echo "HIDEOUT_BPF_CLANG=${llvm_prefix}/bin/clang" >>"$GITHUB_ENV"
          echo "HIDEOUT_BPF_LLVM_STRIP=${llvm_prefix}/bin/llvm-strip" >>"$GITHUB_ENV"

      - name: Reject stale feature artifacts or missing licenses
        run: |
          set -euo pipefail
          scripts/gates/generated.sh
          scripts/gates/dependency-licenses.sh

      - name: Run the complete local contract gate
        env:
          # A skipped tap parity check is not parity proof: CI checks out the
          # official tap and fails closed if the comparison cannot run.
          HIDEOUT_REQUIRE_TAP_PARITY: "1"
          HIDEOUT_TAP_FORMULA: ${{ github.workspace }}/.homebrew-tap-parity/Formula/hideout.rb
        run: scripts/test-gate0.sh
