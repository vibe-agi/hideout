name: Bug report
description: Report a reproducible Hideout product defect
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities or paste secrets here. Use the private
        reporting path in SECURITY.md.
  - type: textarea
    id: version
    attributes:
      label: Hideout version
      description: Paste the complete output of `hideout version`.
      render: text
    validations:
      required: true
  - type: input
    id: package_digest
    attributes:
      label: Package SHA-256
      description: Use `unknown` only for a source development build.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Host platform and backend
      placeholder: macOS arm64, Lima
    validations:
      required: true
  - type: input
    id: recovery_code
    attributes:
      label: Recovery code
      description: Paste the stable code shown by Hideout, or `none` when no code was emitted.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Remove secrets, private paths, and source evidence content.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor summary
      description: Paste a reviewed summary or attach an approved audit export. Control-plane redaction does not remove all user data.
